        #LOC_OPT_arie73_desc = “ARI”，也就是空气增强火箭启动发动机（Air-augmented Rocket Initiated Engine），是——或者说曾经是——OPT 创新能力的一个闪亮样板。随着 OPT-E 系列发动机升级面世、ARI-75 发布，它退居二线。这款发动机本身也重新定位，占住了自己新的生态位。它各方面性能都不输 ARI-75，只是不再需要氧化剂了。
        #LOC_OPT_b_linear_aerospike_desc = 为 OPT 机身打造的极强气尖式火箭。宣传性能时，OPT 强调别光盯着那行小字，重点看它有多帅。巧合的是，那行小字写的是「警告：可能过热」。
        #LOC_OPT_J61_desc = 这台紧凑复古的 Mk2 发动机，在爱 OPT 的人和嫌弃 OPT 的人当中都出了名。作为一台吸气式发动机，Starwaster 是股不容小觑的力量，也是“想今天就上天”的人手里一张特别贵的门票。也许它这个绰号真该当真……
        #LOC_OPT_j81turbojet_desc = 当 OPT 推进科学部的 Kerbal 们揭开这台机器时，那副样子只能形容为撞见了超自然存在——是好是坏就不好说了。这东西的性能参数让它看起来领先时代一百年，甚至一千年。任何反复要求驾驶装这台发动机的飞船的飞行员，都得接受……并且也该被施加……极端的谨慎与审视。
        #LOC_OPT_opt_vtol_bubble1_desc = “泡泡”是一台独特的高级混合发动机，也是成果里的一朵奇葩。它紧凑的壳子里同时塞进了涡扇、冲压，以及一台超频的 ARI SCOOP 火箭（性能类似 J81）的本事。哦对了，它还能像操纵面一样偏转。
        #LOC_OPT_opt_vtol_egg_desc = 一家想用水平着陆器运输重型货物的太空精炼公司提了个特殊需求。在为他们设计这台发动机的过程中，有个机灵鬼随口起了这个名字，结果一下就定下来了。不幸的是，半个工程部笑了好几分钟，还打碎了几颗真鸡蛋，这名字就更牢固了。
        #LOC_OPT_opt_egg_desc = 一家想用水平着陆器运输重型货物的太空精炼公司提了个特殊需求。在为他们设计这台发动机的过程中，有个机灵鬼随口起了这个名字，结果一下就定下来了。不幸的是，半个工程部笑了好几分钟，还打碎了几颗真鸡蛋，这名字就更牢固了。
        #LOC_OPT_opt_sage_desc = 自从 S.U.R.G.E. 问世并获得好评之后，很快就有了为更小空天飞机准备一款紧凑、经济型号的需求。他们选了极受欢迎的 J-61 发动机框架，但一些设计上的考量让它在稠密大气里不太够用。于是，这东西被命名为 S.A.G.E（平流层增强（波动）高斯发动机）。
        #LOC_OPT_opt_surge_desc = 这台发动机首次发布时那副别扭的设计，在它把 OPT 搞破产这件事上也是要算一笔的。救兵来自一个叫“Deep Sky”的神秘机构，他们送来一台改装过的原型发动机，装的是所谓的 WarpJet——一种靠超强磁线圈组件把任何空气压缩并燃烧的技术。OPT 仔细审过之后接受了，并把 WarpJet 与 S.C.O.O.P. 结合，造出了 S.U.R.G.E（侧向波动呼吸式高斯发动机）。
        #LOC_OPT_opt_vtol_heli1_desc = 并不是每架 OPT 空天飞机都靠吸入高超音速气流飞行。不靠的那些，在低速飞行时可能会需要一种高效方案。带有 1.25m 和 3.75m 接口。使用顶部 3.75m 接口会禁用进气道。尾焰不会损伤其他零件，因此可以安全串联堆叠。
        #LOC_OPT_opt_vtol_hc1_desc = 光有一台只在大气里好使的升力发动机还不够，所以这台流线型的气动巨兽既是风扇又是尖锥。它能封住 3.75m 堆叠的底部，甚至能把发动机那部分朝下展开，好装下非常厚的机翼（最厚 0.5m）。
        #LOC_OPT_opt_vtol_lpj1_desc = 体积做得小，对很多工程目标来说至关重要。就这款发动机而言，我们算是把这条做到了极致。它更像一个旁通导流器而不是正统发动机，速度越快功率越高，非常省油，但对进气要求极高。
        #LOC_OPT_opt_vtol_lpr1_desc = 体积做得小，对很多工程目标来说至关重要。就这款发动机而言，我们算是把这条做到了极致。低矮扁平的 Prominence 发动机在同尺寸同重量里既强劲又先进，不过它不像 ARI 系列那样利用气流。
        #LOC_OPT_opt_vtol_lpr2_desc = 对许多工程目标来说，把占地压小至关重要。就这台发动机而言，我们算是把这条做到了极致。矮扁的 Irradiance 发动机相对于它的体积和重量来说既强劲又先进，不过它不像 ARI 系列发动机那样会利用气流。
        #LOC_OPT_opt_vtol_rudder1_desc = OPT 的高管们早就注意到上升段会出现一种怪现象，内部管它叫“幽灵偏航”。有一阵子，大家对这现象的主流对策是“多上几个助推器（带偏航矢量）”或者“忍着”。不过过了相当久之后，终于有人出了个妙招：造一个既符合空气动力学、又能吸气工作的 RCS 装置。
        #LOC_OPT_opt_vtol_wrapl1_desc = 这个强力配件——机身垂直推进器——挂在机身两侧，带可工作的进气与排气挡板，用来保护内部机构不被再入的火烧穿。注意：排气挡板关着的时候千万别点火！
        #LOC_OPT_opt_vtol_wrapl2_desc = 这个强力配件——机身垂直推进器——挂在机身两侧，带可工作的进气与排气挡板，用来保护内部机构不被再入的火烧穿。注意：排气挡板关着的时候千万别点火！
        #LOC_OPT_turboRamJetj_60_desc = Kerbal 科学家以前以为，Bob Kerman 的飞船飞过马赫 3 时会在后座尖叫。但 Wernher 相信 Bob 是个勇敢的 Kerbal，飞行时绝不会尖叫。他认为那声音是某种特殊机体形状与超高速气流相互作用造成的。进一步调查后，Wernher 发表了他关于「尖叫」效应的理论。OPT 的科学家把这一理论用到了他们最新的大气推进项目上——虽然这让 OPT 破了产，但他们确实造出了史上第一台尖叫喷气发动机！低速时它就是普通涡喷。速度更高时，它开始尖叫！在短暂的一段时间里，「尖叫」效应会接管，提供一记强力推进。速度再高，它就炸了。
        #LOC_OPT_turboRamJetj_60d_desc = 费了不少功夫去磨 OPT 的高管，他们才肯点头——尽管他们在吸气式发动机上的名声一直很好——再造一款双模式发动机，而且还得是可堆叠的那种。这台 J-60D 继承了 J-61 出名的高空大推力潜力，以及接近 J-81 短舱的液氧/煤油暴力输出。最妙的是，它依然是台 ScreamJet……所以请确保所有人都戴好护耳。
